name: Desktop GUI CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'publisher/**'
      - 'requirements.txt'
      - '.github/workflows/desktop-ci.yml'
      - 'tests/**'
      - 'src/data/photo-view.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build + installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Python backend
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile publisher/cli.py
          python -c "import publisher; from PIL import Image; print('Publisher backend ready')"
          python -m unittest discover -s tests -p "test_*.py"

      - name: Check photography display rules
        run: node --test tests/photo-view.test.mjs

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build React frontend
        working-directory: desktop
        run: npm run build

      - name: Check Tauri Rust bridge
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build Windows desktop app
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndRainWindow-Publisher-Windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/andrainwindow-publisher.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  cross-platform-check:
    name: ${{ matrix.name }} compile check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Python backend
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile publisher/cli.py
          python -c "import publisher; from PIL import Image; print('Publisher backend ready')"
          python -m unittest discover -s tests -p "test_*.py"

      - name: Check photography display rules
        run: node --test tests/photo-view.test.mjs

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build React frontend
        working-directory: desktop
        run: npm run build

      - name: Check Tauri Rust bridge
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  release:
    name: Publish requested desktop release
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs: [windows-build, cross-platform-check, desktop-interaction]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AndRainWindow-Publisher-Windows
          path: release-artifacts
      - name: Publish binaries from this tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./desktop/package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          mkdir release-upload
          while IFS= read -r -d '' file; do cp "$file" release-upload/; done < <(find release-artifacts -type f -name '*.exe' -print0)
          test "$(find release-upload -name '*.exe' | wc -l)" -eq 2
          (cd release-upload && sha256sum ./*.exe > SHA256SUMS.txt)
          gh release create "$tag" release-upload/* --target "$GITHUB_SHA" --title "AndRainWindow Publisher $tag" --notes-file docs/PUBLISHER_RELEASE_NOTES.md --draft
          gh release edit "$tag" --draft=false

  desktop-interaction:
    name: Desktop interaction and website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npm install --prefix desktop
          npm install --prefix "$RUNNER_TEMP/ui-tools" --no-save playwright
      - name: Build unchanged website layout
        run: npm run build
      - name: Test desktop interactions against the Python photo backend
        env:
          PUBLISHER_TEST_CHROME: /usr/bin/google-chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/ui-tools/node_modules"
          npm run dev --prefix desktop > "$RUNNER_TEMP/desktop-ui.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:1420/ >/dev/null && break || sleep 1; done
          node tests/test_desktop_ui.cjs
      - name: Save UI check screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Publisher-UI-check
          path: |
            ${{ runner.temp }}/publisher-photo-ui.png
            ${{ runner.temp }}/desktop-ui.log
