name: Publish Publisher v0.1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publisher-release.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publisher-release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify original successful build
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: 35827289081
            });
            if (run.conclusion !== 'success' || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/desktop-ci.yml' ||
                run.head_sha !== '33396088f03bd44061c81ece900e9c5a6526b8d9') {
              throw new Error('Source build does not match the approved release');
            }

      - name: Download original Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: AndRainWindow-Publisher-Windows
          path: release-assets
          run-id: 35827289081
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release with binaries and checksums
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const tag = 'v0.1.0';
            const sha = '33396088f03bd44061c81ece900e9c5a6526b8d9';
            const walk = dir => fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const p = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(p) : [p];
            });
            const files = walk('release-assets').filter(p => p.endsWith('.exe'));
            if (files.length !== 2 || !files.some(p => path.basename(p) === 'andrainwindow-publisher.exe') ||
                !files.some(p => p.endsWith('-setup.exe'))) {
              throw new Error('Expected the standalone Windows executable and NSIS installer');
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              throw new Error('Release already exists; refusing to replace published assets');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const body = [
              'AndRainWindow Publisher 桌面版：Tauri 2 + React，调用本机 Python Publisher。',
              '',
              '## 下载与使用',
              '- Windows x64：日常使用下载并安装 `*-setup.exe`。',
              '- `andrainwindow-publisher.exe` 为独立程序文件，仍需系统运行环境。',
              '- 需要本机 Python 3、Pillow，以及本网站仓库；未使用 PyInstaller，也未内置 Python。',
              '- 在项目根目录运行 `python -m pip install -r requirements.txt`，然后在 Settings 选择项目及 Vault。',
              '',
              '## 功能',
              '- Obsidian 公开笔记发布、WebP 迁移、路径与 Python 环境检查、实时日志。',
              '- 本版本尚不包含独立摄影导入页面。',
              '',
              '## 验证与来源',
              '- Windows 安装包构建成功；Linux/macOS 前端与 Rust 编译检查通过。',
              '- 编译检查不等同于全部桌面交互已通过实机测试。',
              `- 源代码提交：${sha}`,
              '- 原始构建：https://github.com/AndRainWindow/AndRainWindow.github.io/actions/runs/35827289081',
              '- 使用手册：https://github.com/AndRainWindow/AndRainWindow.github.io/blob/v0.1.0/docs/PUBLISHER_USER_GUIDE.md',
              '- SHA256SUMS.txt 可用于校验下载文件。'
            ].join('\n');
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: sha,
              name: 'AndRainWindow Publisher v0.1.0', body, draft: true, prerelease: false
            });
            const checksums = [];
            for (const file of files) {
              const data = fs.readFileSync(file);
              const name = path.basename(file);
              checksums.push(`${crypto.createHash('sha256').update(data).digest('hex')}  ${name}`);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data
              });
            }
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name: 'SHA256SUMS.txt',
              data: Buffer.from(checksums.join('\n') + '\n')
            });
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false
            });
            core.info(`Published ${release.html_url}`);
